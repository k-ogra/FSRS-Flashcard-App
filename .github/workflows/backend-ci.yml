name: CI - Build, Test, and Coverage

on:
  push:
    branches:
      - main
    paths:
      - backend/**
  pull_request:
    branches:
      - main
    paths:
      - backend/**

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_TEST_USER  }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_TEST_DB}}
        ports:
          - 5432:5432
        options: 
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and run tests with Maven
        run: mvn -ntp -B verify
        env:
          POSTGRES_TEST_USER: ${{ secrets.POSTGRES_TEST_USER }}
          POSTGRES_TEST_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_TEST_DB_URL: ${{ secrets.POSTGRES_TEST_DB_URL }}
          S3_TEST_REGION: ${{ secrets.S3_TEST_REGION }}
          S3_TEST_BUCKET_NAME: ${{ secrets.S3_TEST_BUCKET_NAME }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: backend/target/jacoco-report/jacoco.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
