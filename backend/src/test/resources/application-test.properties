spring.application.name=FSRS-Flashcard-App-Test
spring.datasource.url=${POSTGRES_TEST_DB_URL} 
spring.datasource.username=${POSTGRES_TEST_USER}
spring.datasource.password=${POSTGRES_TEST_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

aws.s3.region=${S3_TEST_REGION}
aws.s3.bucket.name=${S3_TEST_BUCKET_NAME}

cors.allowed-origins=http://localhost:3000
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=7d